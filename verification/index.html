<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Verify Company Details</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        background: #f5f7fb;
        margin: 0;
        padding: 20px;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #fff;
        width: 100%;
        max-width: 720px;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      /* Layout Grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      .field label {
        font-size: 13px;
        margin-bottom: 6px;
        display: block;
        font-weight: 600;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      input:focus {
        border-color: #5b7cfa;
        outline: #5b7cfa;
        box-shadow: 0 0 8px rgba(91, 124, 250, 0.2);
      }
      /* Phone & Location specifically */
      .phone-field {
        display: flex;
        gap: 8px;
      }
      #select-phone {
        width: 35%;
      }
      .input-icon {
        position: relative;
      }
      .input-icon img {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        opacity: 0.5;
      }

      /* Upload Area */
      .upload-container {
        grid-column: span 2;
        display: flex;
        gap: 16px;
        margin-top: 10px;
      }
      .upload-box {
        flex: 1;
      }
      .upload-area {
        height: 100px;
        border: 2px dashed #d7dff5;
        border-radius: 12px;
        background: #fafbff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .upload-area img {
        width: 30px;
        margin-bottom: 5px;
      }
      .upload-area small {
        font-size: 10px;
        color: #777;
        text-align: center;
        line-height: 1.4;
      }

      /* CHECKBOX SECTION (Matches your image) */
      #services {
        margin-top: 25px;
      }
      #services p {
        font-weight: bold;
        font-size: 15px;
        margin-bottom: 15px;
      }
      .checkbox-group {
        display: flex;
        flex-wrap: wrap; /* Allows items to wrap to next line */
        gap: 15px 40px; /* Space between rows and columns */
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        min-width: 120px; /* Ensures columns align vertically */
        cursor: pointer;
        font-size: 14px;
      }
      .checkbox-item input {
        width: auto; /* Important: reset the 100% width from global style */
        margin-right: 10px;
        cursor: pointer;
      }

      /* VERIFY BUTTON */
      .btn-container {
        text-align: center;
        margin-top: 40px;
      }
      .btn {
        width: 60%;
        padding: 15px;
        border-radius: 30px;
        border: none;
        background: #c5d3f5; /* Faded blue when disabled */
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: not-allowed;
        transition: background 0.3s ease;
      }
      /* Active blue color from your image */
      .btn.active {
        background: #5b7cfa !important;
        cursor: pointer;
      }

      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .modal-content {
        background: #fff;
        width: 90%;
        max-width: 350px;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      .icon-box {
        width: 70px;
        height: 70px;
        background: #e8efff;
        color: #1f5bd7;
        font-size: 32px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
      }
      .modal-content button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #5b7cfa;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      .modal-content h3 {
        margin-bottom: 10px;
        color: red;
      }

      .modal-content p {
        font-size: 14px;
        color: #555;
        margin-bottom: 20px;
      }
      @media (max-width: 600px) {
        .grid,
        .upload-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h2>Verify Company Details</h2>
        <form id="verifyForm">
          <div class="grid">
            <div class="field">
              <label>Company Name</label>
              <input type="text" placeholder="Ajd-wise Limited" />
            </div>
            <div class="field">
              <label>Company Email</label>
              <input type="email" placeholder="ajdwise54@yahoo.com" />
            </div>

            <div class="field">
              <label>Company Phone</label>
              <div class="phone-field">
                <select id="select-phone">
                  <option value="+234">+234</option>
                </select>
                <input type="tel" placeholder="9067845689" />
              </div>
            </div>
            <div class="field">
              <label>Location</label>
              <div class="input-icon">
                <input type="text" placeholder="Abuja, Nigeria" />
                <img src="../assets/images/location-icon.png" alt="Loc" />
              </div>
            </div>
            <div class="upload-container">
              <div class="upload-box">
                <label>Upload Company Registration Document</label>
                <label class="upload-area">
                  <input type="file" hidden />
                  <img
                    src="https://cdn-icons-png.flaticon.com/512/3342/3342137.png"
                    alt="icon"
                  />
                  <small
                    ><strong>click to replace</strong> or drag and drop<br />SVG,
                    PNG, JPG (MAX 800 X 400PX)</small
                  >
                </label>
              </div>
              <div class="upload-box">
                <label>Upload License Document</label>
                <label class="upload-area">
                  <input type="file" hidden />
                  <img
                    src="https://cdn-icons-png.flaticon.com/512/3342/3342137.png"
                    alt="icon"
                  />
                  <small
                    ><strong>click to replace</strong> or drag and drop<br />SVG,
                    PNG, JPG (MAX 800 X 400PX)</small
                  >
                </label>
              </div>
            </div>
          </div>
          <div id="services">
            <p>Type of service Rendered</p>
            <div class="checkbox-group">
              <label class="checkbox-item"
                ><input type="checkbox" class="service-check" /> ICU</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" class="service-check" /> Carrier</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" class="service-check" /> Emergency
                Response</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" class="service-check" /> Trauma
                Response</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" class="service-check" /> Basic Life
                Support (BLS)</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" class="service-check" /> Other</label
              >
            </div>
          </div>
          <div class="btn-container">
            <button type="submit" class="btn" id="verifyBtn" disabled>
              Verify
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="modal" id="emailModal">
      <div class="modal-content">
        <div class="icon-box">😞</div>
        <h3>Oops! Something Went Wrong</h3>
        <p>We couldn`t Submit your details for verification.</p>
        <p>Please check your internet connection and try again later</p>
        <button onclick="tryModal()" class="try-btn">Try Again</button>
      </div>
    </div>
    <script>
      const checkboxes = document.querySelectorAll(".service-check");
      const verifyBtn = document.getElementById("verifyBtn");
      checkboxes.forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          // Check if at least one checkbox is checked
          const isAnyChecked = Array.from(checkboxes).some((cb) => cb.checked);

          if (isAnyChecked) {
            verifyBtn.disabled = false;
            verifyBtn.classList.add("active");
          } else {
            verifyBtn.disabled = true;
            verifyBtn.classList.remove("active");
          }
        });
        document
          .getElementById("verifyForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();

            // Normally you would send data to backend here

            // Show the modal
            document.getElementById("emailModal").style.display = "flex";
          });
        function tryModal() {
          document.getElementById("emailModal").style.display = "none";
        }
      });
    </script>
  </body>
</html>
